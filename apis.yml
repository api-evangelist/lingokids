aid: lingokids
name: Lingokids
description: 'Lingokids is a children''s edutainment platform operated by Monkimun Inc. (Wilmington, Delaware)
  and Monkimun Labs S.L. (Madrid, Spain), delivering an ad-free "Playlearning" experience of games, animated
  shows, podcasts and sing-alongs for children aged two to eight. The mobile apps (iOS, Android, Amazon) and
  web app have been downloaded more than 200 million times. The curriculum is built by parents and educators
  and covers English-language learning alongside broader academic and life skills. Lingokids is audited and
  certified by the kidSAFE Seal Program (COPPA+), operates a COPPA-compliant configuration for child data,
  and honours GDPR rights for EU residents. The company publishes no public developer program or documented
  API: api.lingokids.com is the private application backend and exposes no discovery surface. Lingokids does
  publish an RFC 9116 security.txt with a security contact, names a Data Protection Officer, and runs a public
  help center. Backed by HV Capital.'
